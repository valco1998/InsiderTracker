<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <!-- InsiderTracker theme: applied before first paint (no flash). Light is the default. -->
    <script>
      (function () {
        var t = "light";
        try { var s = localStorage.getItem("it.theme"); if (s === "dark" || s === "light") t = s; } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector("meta[name=theme-color]");
        if (m) m.setAttribute("content", t === "dark" ? "#0B1120" : "#F8FAFC");
      })();
    </script>
    <title>InsiderTracker</title>
    <link rel="icon" type="image/png" href="/telIcon.png" />
    <link rel="canonical" href="https://www.skin-tel.com/" />

    <!-- Open Graph (Facebook, WhatsApp, Telegram, Discord, iMessage) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="SKINTEL" />
    <meta property="og:title"       content="SKINTEL" />
    <meta property="og:description" content="CS2 Trading, Market Intelligence &amp; Inventory Platform" />
    <meta property="og:url"         content="https://skin-tel.com" />
    <meta property="og:image"       content="https://skin-tel.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SKINTEL" />
    <meta name="twitter:description" content="CS2 Trading, Market Intelligence &amp; Inventory Platform" />
    <meta name="twitter:image"       content="https://skin-tel.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
