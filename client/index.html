<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <!-- InsiderTracker theme: applied before first paint (no flash). Light is the default. -->
    <script>
      (function () {
        var t = "light";
        try { var s = localStorage.getItem("it.theme"); if (s === "dark" || s === "light") t = s; } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector("meta[name=theme-color]");
        if (m) m.setAttribute("content", t === "dark" ? "#0B1120" : "#F8FAFC");
      })();
    </script>
    <title>InsiderTracker</title>
    <!-- Small (7 KB, 192px) InsiderTracker icon; telIcon.png (1 MB) stays for the PWA manifest. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/insider-notification-192.png" />
    <!-- Fonts: one non-blocking-chain stylesheet = union of what index.css and insider.css used to @import. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <meta name="description" content="InsiderTracker — SEC Form 4 insider purchases and sales, company screener, analytics and backtesting." />

    <!-- Link previews. No canonical/og:url/og:image until InsiderTracker has its own public domain and preview image
         (the previous values pointed at SkinTel's skin-tel.com). -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="InsiderTracker" />
    <meta property="og:title"       content="InsiderTracker" />
    <meta property="og:description" content="SEC Form 4 insider purchases and sales, company screener, analytics and backtesting." />
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="InsiderTracker" />
    <meta name="twitter:description" content="SEC Form 4 insider purchases and sales, company screener, analytics and backtesting." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
